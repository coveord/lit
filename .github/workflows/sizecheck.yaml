name: Sizecheck

on: [pull_request]

permissions:
  contents: read

jobs:
  checksize:
    name: sizecheck

    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 24.5
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4

      - name: NPM install
        run: npm ci

      # This is needed to be able to read it from sizecheck-report.yaml to
      # comment on the correct PR
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo $PR_NUMBER > ./scripts/pr_number.txt

      - name: Generate size report
        run: npm run benchmark:size

      - name: Upload artifacts
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: sizecheck
          path: |
            scripts/check-size-out.md
            scripts/pr_number.txt
